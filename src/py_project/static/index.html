<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document Scanner</title>
  <style>
    :root {
      color-scheme: light dark;
      --border: #d0d0d0;
      --bg-soft: #f6f6f7;
      --success: #1a7f37;
      --success-bg: #dafbe1;
      --warning: #9a6700;
      --warning-bg: #fff8c5;
      --error: #b91c1c;
      --error-bg: #ffe6e6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --border: #3d3d3d;
        --bg-soft: #1e1e1e;
        --success-bg: #0f2e18;
        --warning-bg: #332b00;
        --error-bg: #3a0d0d;
      }

      body {
        background: #121212;
        color: #eaeaea;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
    }

    p.subtitle {
      color: #777;
      margin-top: 0;
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      background: var(--bg-soft);
      transition: border-color 0.15s;
    }

    .dropzone.dragover {
      border-color: #3b82f6;
    }

    .dropzone input {
      display: none;
    }

    #file-list {
      list-style: none;
      padding: 0;
      margin: 1rem 0;
    }

    #file-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }

    #file-list button {
      border: none;
      background: none;
      color: var(--error);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0.25rem;
    }

    #clear-files {
      margin: -0.5rem 0 1rem;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1rem 0;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .options label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      gap: 0.25rem;
    }

    .options .checkbox {
      flex-direction: row;
      align-items: center;
      gap: 0.4rem;
    }

    select,
    input[type="number"] {
      padding: 0.35rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: inherit;
    }

    button#submit {
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button#submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }

    th,
    td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.6rem;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--bg-soft);
    }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge.success {
      color: var(--success);
      background: var(--success-bg);
    }

    .badge.warning {
      color: var(--warning);
      background: var(--warning-bg);
    }

    .badge.error {
      color: var(--error);
      background: var(--error-bg);
    }

    .actions a {
      margin-right: 0.6rem;
      font-size: 0.85rem;
    }

    .actions button.link-button {
      margin-right: 0.6rem;
      font-size: 0.85rem;
      border: none;
      background: none;
      color: #3b82f6;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      font-family: inherit;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay[hidden] {
      display: none;
    }

    .modal-box {
      background: #000;
      color: #eaeaea;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid #333;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .modal-header button {
      border: none;
      background: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: inherit;
      line-height: 1;
    }

    .modal-body {
      flex: 1;
      display: flex;
      gap: 2px;
      background: #333;
      min-height: 0;
    }

    .compare-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      background: #000;
    }

    .compare-pane img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .compare-pane iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    #status-line {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: #777;
    }

    .capture-row {
      display: flex;
      justify-content: center;
      margin: 0.75rem 0 0;
    }

    button#open-camera {
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .camera-modal-box {
      background: #000;
      color: #eaeaea;
      width: 100vw;
      /* 100vh trên Safari di động tính cả phần bị thanh địa chỉ/thanh công
         cụ che mất, đẩy nút cuối cùng ra ngoài màn hình thực tế nhìn thấy
         được ("mất nút"). 100dvh (dynamic viewport height, hỗ trợ từ iOS
         15.4+) tự trừ phần đó - vẫn giữ 100vh làm fallback cho trình duyệt
         cũ hơn. */
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .camera-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1rem;
      padding-top: max(0.6rem, env(safe-area-inset-top));
      border-bottom: 1px solid #333;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .camera-header button {
      border: none;
      background: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: inherit;
      line-height: 1;
    }

    .camera-body {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
    }

    #camera-live-view,
    #camera-preview-view,
    #camera-result-view {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    /* [hidden] chỉ thắng khi KHÔNG có rule display khác cùng cấp độ ưu
       tiên (origin) đè lên - author CSS "display: flex" ở trên sẽ thắng
       UA stylesheet "[hidden]{display:none}" nếu thiếu override tường
       minh này (đã gặp đúng lỗi này với .camera-controls ở trên). */
    #camera-live-view[hidden],
    #camera-preview-view[hidden],
    #camera-result-view[hidden] {
      display: none;
    }

    .camera-body video,
    .camera-body img {
      max-width: 100%;
      max-height: 100%;
      min-height: 0;
      object-fit: contain;
    }

    .camera-status {
      position: absolute;
      top: 0.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.85rem;
      color: #ddd;
      pointer-events: none;
    }

    .camera-issues {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--error-bg);
      color: var(--error);
      padding: 0.75rem 1rem;
      font-size: 0.88rem;
      max-height: 45%;
      overflow-y: auto;
    }

    .camera-issues ul {
      margin: 0.35rem 0 0;
      padding-left: 1.2rem;
    }

    .camera-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.75rem 1rem;
      padding: 0.85rem 1rem;
      /* Chừa khoảng cho vùng home-indicator/bo góc màn hình ở cuối iPhone
         không có nút Home - nếu không nút cuối dễ bị che/khó bấm chuẩn. */
      padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
      flex-shrink: 0;
    }

    .camera-controls[hidden] {
      display: none;
    }

    .camera-controls button,
    .camera-controls a {
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      border: 1px solid #555;
      background: #1c1c1c;
      color: #eaeaea;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    .camera-controls button#camera-capture {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
      font-weight: 600;
    }

    .camera-controls button#camera-use,
    .camera-controls button#camera-result-done {
      background: #1a7f37;
      border-color: #1a7f37;
      color: white;
      font-weight: 600;
    }

    .camera-controls a#camera-result-download {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
      font-weight: 600;
    }

    .camera-controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .camera-result-status {
      margin-top: 0.6rem;
      text-align: center;
      font-size: 0.85rem;
      color: #ddd;
    }
  </style>
</head>

<body>
  <h1>Document Scanner</h1>
  <p class="subtitle">Chọn một hoặc nhiều file PDF/ảnh, crop và làm rõ theo kiểu scanner.</p>

  <div class="dropzone" id="dropzone">
    <p>Kéo thả file vào đây, hoặc bấm để chọn (chọn được nhiều file cùng lúc)</p>
    <input type="file" id="file-input" multiple accept=".pdf,.jpg,.jpeg,.png,.bmp,.tiff,.webp,.heic" />
  </div>

  <div class="capture-row">
    <button id="open-camera" type="button">📷 Chụp ảnh (điện thoại/laptop)</button>
  </div>

  <ul id="file-list"></ul>
  <button id="clear-files" type="button" hidden>Bỏ tất cả</button>

  <div class="options">
    <label>
      Mode
      <select id="opt-mode">
        <option value="scan">scan (ảnh xám)</option>
        <option value="color" selected>color (giữ màu)</option>
        <option value="bw">bw (đen trắng)</option>
      </select>
    </label>
    <label>
      Rotate
      <select id="opt-rotate">
        <option value="0" selected>0</option>
        <option value="90">90</option>
        <option value="180">180</option>
        <option value="270">270</option>
      </select>
    </label>
    <label>
      DPI (PDF)
      <input type="number" id="opt-dpi" value="200" min="72" max="600" />
    </label>
    <label class="checkbox">
      <input type="checkbox" id="opt-crop" checked />
      Tự tìm viền (crop)
    </label>
    <label class="checkbox">
      <input type="checkbox" id="opt-debug" />
      Xuất ảnh debug
    </label>
  </div>

  <button id="submit" disabled>Xử lý</button>
  <div id="status-line"></div>

  <table id="results" hidden>
    <thead>
      <tr>
        <th>File</th>
        <th>Trạng thái</th>
        <th>Chi tiết</th>
        <th>Thời gian</th>
        <th>Liên kết</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="modal-overlay" id="compare-modal" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <span>So sánh ảnh gốc / kết quả</span>
        <button id="compare-close" type="button">✕</button>
      </div>
      <div class="modal-body">
        <div class="compare-pane">
          <img id="compare-original-img" alt="Ảnh gốc" hidden />
          <iframe id="compare-original-frame" title="Ảnh gốc" hidden></iframe>
        </div>
        <div class="compare-pane">
          <img id="compare-result-img" alt="Ảnh kết quả" hidden />
          <iframe id="compare-result-frame" title="Ảnh kết quả" hidden></iframe>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="camera-modal" hidden>
    <div class="camera-modal-box">
      <div class="camera-header">
        <span>Chụp ảnh tài liệu</span>
        <button id="camera-close" type="button">✕</button>
      </div>
      <div class="camera-body">
        <div id="camera-live-view">
          <video id="camera-video" autoplay playsinline muted></video>
        </div>
        <div id="camera-preview-view" hidden>
          <img id="camera-preview-img" alt="Ảnh vừa chụp" />
        </div>
        <div id="camera-result-view" hidden>
          <img id="camera-result-img" alt="Ảnh đã crop" />
          <div class="camera-result-status" id="camera-result-status"></div>
        </div>
        <div class="camera-status" id="camera-status"></div>
        <div class="camera-issues" id="camera-issues" hidden></div>
      </div>
      <div class="camera-controls" id="camera-live-controls">
        <button id="camera-switch" type="button">🔄 Đổi camera</button>
        <button id="camera-capture" type="button">⬤ Chụp</button>
      </div>
      <div class="camera-controls" id="camera-preview-controls" hidden>
        <button id="camera-retake" type="button">↩ Chụp lại</button>
        <button id="camera-use" type="button">✓ Dùng ảnh này</button>
      </div>
      <div class="camera-controls" id="camera-result-controls" hidden>
        <button id="camera-result-retake" type="button">📷 Chụp ảnh khác</button>
        <a id="camera-result-download" class="camera-download-link" download>⬇ Tải xuống</a>
        <button id="camera-result-done" type="button">✓ Xong</button>
      </div>
    </div>
  </div>
  <canvas id="camera-canvas" hidden></canvas>

  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    const fileListEl = document.getElementById("file-list");
    const clearFilesBtn = document.getElementById("clear-files");
    const submitBtn = document.getElementById("submit");
    const statusLine = document.getElementById("status-line");
    const resultsTable = document.getElementById("results");
    const resultsBody = resultsTable.querySelector("tbody");
    const compareModal = document.getElementById("compare-modal");
    const compareOriginalImg = document.getElementById("compare-original-img");
    const compareResultImg = document.getElementById("compare-result-img");
    const compareOriginalFrame = document.getElementById("compare-original-frame");
    const compareResultFrame = document.getElementById("compare-result-frame");
    const compareCloseBtn = document.getElementById("compare-close");

    function isPdfFile(file)
    {
      return file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    }

    let selectedFiles = [];
    let originalFileUrls = [];

    function formatSize(bytes)
    {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function renderFileList()
    {
      fileListEl.innerHTML = "";
      selectedFiles.forEach((file, index) =>
      {
        const li = document.createElement("li");
        const label = document.createElement("span");
        label.textContent = `${file.name} (${formatSize(file.size)})`;
        const removeBtn = document.createElement("button");
        removeBtn.textContent = "✕";
        removeBtn.title = "Bỏ file này";
        removeBtn.addEventListener("click", () =>
        {
          selectedFiles.splice(index, 1);
          renderFileList();
        });
        li.appendChild(label);
        li.appendChild(removeBtn);
        fileListEl.appendChild(li);
      });
      submitBtn.disabled = selectedFiles.length === 0;
      clearFilesBtn.hidden = selectedFiles.length === 0;
    }

    function addFiles(fileArray)
    {
      for (const file of fileArray) {
        selectedFiles.push(file);
      }
      renderFileList();
    }

    clearFilesBtn.addEventListener("click", () =>
    {
      selectedFiles = [];
      renderFileList();
    });

    // --- Chụp ảnh từ camera (mobile/laptop) ---------------------------
    //
    // Luồng: mở camera -> chụp -> gửi ảnh sang /api/capture/scan (QC dính
    // tay/mờ/nền nhiễu/không thấy tài liệu, rồi crop LUÔN nếu đạt - gộp
    // vào một lượt upload duy nhất thay vì gọi 2 endpoint riêng, đỡ chậm
    // trên mạng di động). Không đạt QC thì hiển thị lý do và bắt chụp lại.
    // Đạt thì hiện luôn ảnh đã crop trong modal, không cần thao tác thêm.
    const openCameraBtn = document.getElementById("open-camera");
    const cameraModal = document.getElementById("camera-modal");
    const cameraCloseBtn = document.getElementById("camera-close");
    const cameraVideo = document.getElementById("camera-video");
    const cameraCanvas = document.getElementById("camera-canvas");
    const cameraLiveView = document.getElementById("camera-live-view");
    const cameraPreviewView = document.getElementById("camera-preview-view");
    const cameraPreviewImg = document.getElementById("camera-preview-img");
    const cameraResultView = document.getElementById("camera-result-view");
    const cameraResultImg = document.getElementById("camera-result-img");
    const cameraResultStatusEl = document.getElementById("camera-result-status");
    const cameraLiveControls = document.getElementById("camera-live-controls");
    const cameraPreviewControls = document.getElementById("camera-preview-controls");
    const cameraResultControls = document.getElementById("camera-result-controls");
    const cameraSwitchBtn = document.getElementById("camera-switch");
    const cameraCaptureBtn = document.getElementById("camera-capture");
    const cameraRetakeBtn = document.getElementById("camera-retake");
    const cameraUseBtn = document.getElementById("camera-use");
    const cameraResultRetakeBtn = document.getElementById("camera-result-retake");
    const cameraResultDownloadLink = document.getElementById("camera-result-download");
    const cameraResultDoneBtn = document.getElementById("camera-result-done");
    const cameraStatusEl = document.getElementById("camera-status");
    const cameraIssuesEl = document.getElementById("camera-issues");

    // Không set openCameraBtn.disabled khi thiếu hỗ trợ: nút bị disable im
    // lặng khiến người dùng bấm không thấy phản hồi gì (đặc biệt trên mobile,
    // không có hover để thấy title) - dễ tưởng nhầm là nút bị lỗi/không hoạt
    // động. Thay vào đó vẫn cho bấm, mở modal và hiện rõ lý do cụ thể.
    function cameraUnsupportedReason()
    {
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
        return window.isSecureContext
          ? "Trình duyệt này không hỗ trợ mở camera."
          : "Cần truy cập qua HTTPS (hoặc localhost) để mở camera - kết nối hiện tại không an toàn.";
      }
      return null;
    }

    let cameraStream = null;
    let cameraFacingMode = "environment";
    let capturedBlob = null;

    function stopCameraStream()
    {
      if (cameraStream) {
        cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
      }
    }

    async function startCameraStream(facingMode)
    {
      stopCameraStream();
      cameraStatusEl.textContent = "Đang mở camera...";
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          // Không ràng buộc "min" cho width/height - máy không đáp ứng nổi
          // sẽ khiến getUserMedia thất bại hẳn thay vì tự hạ xuống mức thấp
          // hơn. "ideal" để trình duyệt cố gắng đạt tới nhưng vẫn tự chọn
          // mức khác nếu camera không hỗ trợ, tránh ảnh chụp mặc định ở độ
          // phân giải thấp (nhiều trình duyệt mặc định 640x480 nếu không
          // yêu cầu gì) rồi bị QC chặn vì "low_resolution".
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
          audio: false,
        });
        cameraVideo.srcObject = cameraStream;
        cameraStatusEl.textContent = "";
      } catch (error) {
        cameraStatusEl.textContent = "Không thể mở camera: " + error.message;
      }
    }

    function showCameraLiveView()
    {
      cameraLiveView.hidden = false;
      cameraPreviewView.hidden = true;
      cameraResultView.hidden = true;
      cameraLiveControls.hidden = false;
      cameraPreviewControls.hidden = true;
      cameraResultControls.hidden = true;
      cameraIssuesEl.hidden = true;
      cameraIssuesEl.textContent = "";
      if (capturedBlob) {
        URL.revokeObjectURL(cameraPreviewImg.src);
        capturedBlob = null;
      }
    }

    function showCameraPreviewView()
    {
      cameraLiveView.hidden = true;
      cameraPreviewView.hidden = false;
      cameraResultView.hidden = true;
      cameraLiveControls.hidden = true;
      cameraPreviewControls.hidden = false;
      cameraResultControls.hidden = true;
    }

    function showCameraResultView()
    {
      cameraLiveView.hidden = true;
      cameraPreviewView.hidden = true;
      cameraResultView.hidden = false;
      cameraLiveControls.hidden = true;
      cameraPreviewControls.hidden = true;
      cameraResultControls.hidden = false;
    }

    openCameraBtn.addEventListener("click", async () =>
    {
      cameraModal.hidden = false;
      showCameraLiveView();

      const unsupportedReason = cameraUnsupportedReason();
      if (unsupportedReason) {
        cameraStatusEl.textContent = unsupportedReason;
        return;
      }

      cameraFacingMode = "environment";
      await startCameraStream(cameraFacingMode);
    });

    cameraCloseBtn.addEventListener("click", () =>
    {
      stopCameraStream();
      cameraModal.hidden = true;
    });

    cameraSwitchBtn.addEventListener("click", async () =>
    {
      cameraFacingMode = cameraFacingMode === "environment" ? "user" : "environment";
      await startCameraStream(cameraFacingMode);
    });

    cameraCaptureBtn.addEventListener("click", () =>
    {
      const width = cameraVideo.videoWidth;
      const height = cameraVideo.videoHeight;
      if (!width || !height) return;
      cameraCanvas.width = width;
      cameraCanvas.height = height;
      cameraCanvas.getContext("2d").drawImage(cameraVideo, 0, 0, width, height);
      cameraCanvas.toBlob((blob) =>
      {
        capturedBlob = blob;
        cameraPreviewImg.src = URL.createObjectURL(blob);
        showCameraPreviewView();
      }, "image/jpeg", 0.92);
    });

    cameraRetakeBtn.addEventListener("click", showCameraLiveView);

    function renderCameraIssues(messages)
    {
      cameraIssuesEl.innerHTML = "";
      const title = document.createElement("strong");
      title.textContent = "Ảnh chưa phù hợp, vui lòng chụp lại:";
      cameraIssuesEl.appendChild(title);
      const list = document.createElement("ul");
      for (const message of messages) {
        const item = document.createElement("li");
        item.textContent = message;
        list.appendChild(item);
      }
      cameraIssuesEl.appendChild(list);
      cameraIssuesEl.hidden = false;
    }

    function renderCameraResult(scan)
    {
      cameraResultImg.src = scan.view_url;
      const parts = [];
      parts.push(scan.status === "warning" ? "Đã crop (có cảnh báo)" : "Đã crop thành công");
      if (scan.warnings && scan.warnings.length) parts.push(scan.warnings.join(", "));
      cameraResultStatusEl.textContent = parts.join(" · ");
      cameraResultDownloadLink.href = scan.download_url;
      showCameraResultView();
    }

    cameraUseBtn.addEventListener("click", async () =>
    {
      if (!capturedBlob) return;
      cameraUseBtn.disabled = true;
      cameraRetakeBtn.disabled = true;
      cameraIssuesEl.hidden = true;
      cameraStatusEl.textContent = "Đang kiểm tra và crop ảnh...";

      const filename = `capture_${Date.now()}.jpg`;
      const formData = new FormData();
      formData.append("file", capturedBlob, filename);
      formData.append("mode", document.getElementById("opt-mode").value);
      formData.append("rotate", document.getElementById("opt-rotate").value);
      formData.append("crop", document.getElementById("opt-crop").checked);
      formData.append("debug", document.getElementById("opt-debug").checked);

      try {
        // Một endpoint duy nhất vừa QC vừa crop luôn nếu đạt - chỉ một lượt
        // upload thay vì gọi QC rồi lại upload lần nữa để xử lý (đỡ tốn
        // băng thông + khỏi chạy GrabCut trùng lặp trên cùng ảnh, vốn là lý
        // do chính khiến bước này "hơi lâu" khi test qua mạng di động).
        const response = await fetch("/api/capture/scan", { method: "POST", body: formData });
        const result = await response.json().catch(() => null);
        if (response.ok && result && result.passed) {
          renderCameraResult(result.scan);
        } else if (response.ok && result) {
          const messages = (result.issues && result.issues.length)
            ? result.issues.map((issue) => issue.message)
            : ["Ảnh không đạt yêu cầu chất lượng, vui lòng chụp lại."];
          renderCameraIssues(messages);
        } else {
          renderCameraIssues([`Lỗi xử lý ảnh: HTTP ${response.status}`]);
        }
      } catch (error) {
        renderCameraIssues(["Lỗi kiểm tra/xử lý ảnh: " + error.message]);
      } finally {
        cameraStatusEl.textContent = "";
        cameraUseBtn.disabled = false;
        cameraRetakeBtn.disabled = false;
      }
    });

    cameraResultRetakeBtn.addEventListener("click", showCameraLiveView);

    cameraResultDoneBtn.addEventListener("click", () =>
    {
      stopCameraStream();
      cameraModal.hidden = true;
    });

    function openCompareModal(originalUrl, resultUrl, isPdf)
    {
      compareOriginalImg.hidden = isPdf;
      compareResultImg.hidden = isPdf;
      compareOriginalFrame.hidden = !isPdf;
      compareResultFrame.hidden = !isPdf;

      if (isPdf) {
        compareOriginalFrame.src = originalUrl;
        compareResultFrame.src = resultUrl;
      } else {
        compareOriginalImg.src = originalUrl;
        compareResultImg.src = resultUrl;
      }
      compareModal.hidden = false;
    }

    function closeCompareModal()
    {
      compareModal.hidden = true;
      compareOriginalFrame.src = "about:blank";
      compareResultFrame.src = "about:blank";
      compareOriginalImg.src = "";
      compareResultImg.src = "";
    }

    compareCloseBtn.addEventListener("click", closeCompareModal);
    compareModal.addEventListener("click", (event) =>
    {
      if (event.target === compareModal) closeCompareModal();
    });
    document.addEventListener("keydown", (event) =>
    {
      if (event.key === "Escape" && !compareModal.hidden) closeCompareModal();
    });

    dropzone.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (event) =>
    {
      addFiles(Array.from(event.target.files));
      fileInput.value = "";
    });

    ["dragenter", "dragover"].forEach((eventName) =>
    {
      dropzone.addEventListener(eventName, (event) =>
      {
        event.preventDefault();
        dropzone.classList.add("dragover");
      });
    });
    ["dragleave", "drop"].forEach((eventName) =>
    {
      dropzone.addEventListener(eventName, (event) =>
      {
        event.preventDefault();
        dropzone.classList.remove("dragover");
      });
    });
    dropzone.addEventListener("drop", (event) =>
    {
      addFiles(Array.from(event.dataTransfer.files));
    });

    function statusBadge(status)
    {
      const span = document.createElement("span");
      span.className = `badge ${status}`;
      span.textContent = status;
      return span;
    }

    function renderResults(results)
    {
      resultsBody.innerHTML = "";
      for (const result of results) {
        const row = document.createElement("tr");

        const nameCell = document.createElement("td");
        nameCell.textContent = result.filename;
        row.appendChild(nameCell);

        const statusCell = document.createElement("td");
        statusCell.appendChild(statusBadge(result.status));
        row.appendChild(statusCell);

        const detailCell = document.createElement("td");
        const details = [];
        if (result.message) details.push(result.message);
        if (result.warnings && result.warnings.length) details.push(...result.warnings);
        if (result.total_pages != null) details.push(`${result.total_pages} trang, crop ${result.cropped_pages}`);
        if (result.cropped != null) details.push(`crop: ${result.cropped ? "có" : "không"}`);
        detailCell.textContent = details.join(" · ") || "-";
        row.appendChild(detailCell);

        const timeCell = document.createElement("td");
        const timeParts = [];
        if (result.processing_time_seconds != null) {
          timeParts.push(`Xử lý: ${result.processing_time_seconds.toFixed(2)}s`);
        }
        if (result.client_round_trip_seconds != null) {
          timeParts.push(`Tổng: ${result.client_round_trip_seconds.toFixed(2)}s`);
        }
        timeCell.textContent = timeParts.join(" · ") || "-";
        row.appendChild(timeCell);

        const linkCell = document.createElement("td");
        linkCell.className = "actions";
        if (result.originalFileUrl && result.view_url) {
          const compareBtn = document.createElement("button");
          compareBtn.type = "button";
          compareBtn.className = "link-button";
          compareBtn.textContent = "So sánh";
          compareBtn.addEventListener("click", () => openCompareModal(result.originalFileUrl, result.view_url, result.isPdf));
          linkCell.appendChild(compareBtn);
        }
        if (result.view_url) {
          const a = document.createElement("a");
          a.href = result.view_url;
          a.target = "_blank";
          a.textContent = "Xem";
          linkCell.appendChild(a);
        }
        if (result.download_url) {
          const a = document.createElement("a");
          a.href = result.download_url;
          a.textContent = "Tải";
          linkCell.appendChild(a);
        }
        if (result.debug_url) {
          const a = document.createElement("a");
          a.href = result.debug_url;
          a.target = "_blank";
          a.textContent = "Debug";
          linkCell.appendChild(a);
        }
        row.appendChild(linkCell);

        resultsBody.appendChild(row);
      }
      resultsTable.hidden = results.length === 0;
    }

    async function scanOneFile(file, options)
    {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("mode", options.mode);
      formData.append("rotate", options.rotate);
      formData.append("dpi", options.dpi);
      formData.append("crop", options.crop);
      formData.append("debug", options.debug);

      const startedAt = performance.now();
      try {
        const response = await fetch("/api/scan", {
          method: "POST",
          body: formData
        });
        const roundTripTime = (performance.now() - startedAt) / 1000;
        if (!response.ok) {
          const errorBody = await response.json().catch(() => ({}));
          return {
            filename: file.name,
            status: "error",
            message: errorBody.detail ? JSON.stringify(errorBody.detail) : `HTTP ${response.status}`,
            client_round_trip_seconds: roundTripTime
          };
        }
        const result = await response.json();
        // result.processing_time_seconds đến từ API = thời gian xử lý thật trên
        // server (chỉ tính lúc scan_pdf/scan_image chạy, không tính upload/network).
        // client_round_trip_seconds là tổng thời gian client đo được (bao gồm cả
        // upload + network) - đặt tên khác để không ghi đè giá trị server trả về.
        result.client_round_trip_seconds = roundTripTime;
        return result;
      } catch (error) {
        return {
          filename: file.name,
          status: "error",
          message: error.message,
          client_round_trip_seconds: (performance.now() - startedAt) / 1000
        };
      }
    }

    submitBtn.addEventListener("click", async () =>
    {
      if (selectedFiles.length === 0) return;

      submitBtn.disabled = true;

      originalFileUrls.forEach((url) => URL.revokeObjectURL(url));
      originalFileUrls = [];

      const options = {
        mode: document.getElementById("opt-mode").value,
        rotate: document.getElementById("opt-rotate").value,
        dpi: document.getElementById("opt-dpi").value,
        crop: document.getElementById("opt-crop").checked,
        debug: document.getElementById("opt-debug").checked
      };

      const results = [];
      renderResults(results);

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        statusLine.textContent = `Đang xử lý file ${i + 1}/${selectedFiles.length}: ${file.name}...`;
        const result = await scanOneFile(file, options);
        const originalFileUrl = URL.createObjectURL(file);
        originalFileUrls.push(originalFileUrl);
        result.originalFileUrl = originalFileUrl;
        result.isPdf = isPdfFile(file);
        results.push(result);
        renderResults(results);
      }

      const totalTime = results.reduce((sum, r) => sum + (r.client_round_trip_seconds || 0), 0);
      statusLine.textContent = `Xong: ${results.length} file đã xử lý trong ${totalTime.toFixed(2)}s.`;
      submitBtn.disabled = selectedFiles.length === 0;
    });
  </script>
</body>
