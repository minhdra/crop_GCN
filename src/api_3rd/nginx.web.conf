# nginx cho container qc-scanner-web (xem Dockerfile.web + docker-compose.web.yml).
#
# Hai việc: (1) phục vụ index.html tĩnh, (2) reverse-proxy /api/ sang API thật ở
# 192.168.120.9:5000. Lý do có bước (2) thay vì để trình duyệt gọi thẳng IP đó:
#
# - Trang này được đặt sau HTTPS (vd https://ocr-staging.hanoi.gov.vn/) trong khi
#   API chỉ có HTTP thuần (docs/api.md, EX-12: chỉ chạy trong LAN, không TLS).
#   Trình duyệt CHẶN đứt "mixed content" — gọi thẳng http://192.168.120.9:5000 từ
#   một trang HTTPS sẽ không bao giờ chạy được, bất kể CORS.
# - Proxy qua cùng origin cũng loại luôn nhu cầu bật CORS ở phía API: trình duyệt
#   thấy toàn bộ request là same-origin (cùng ocr-staging.hanoi.gov.vn), chỉ có
#   chặng nginx -> API (server-to-server, ngoài tầm với của trình duyệt) là còn
#   đi qua HTTP thuần — không sao vì đó không phải là chặng bị same-origin/mixed
#   content policy soi.
#
# Đổi IP/port của API thật thì sửa đúng một chỗ: dòng `proxy_pass` bên dưới.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Khớp MAX_UPLOAD_BYTES phía API (32 MB) — mặc định nginx chỉ nhận 1 MB,
    # thấp hơn nhiều so với giới hạn thật, sẽ tự trả 413 trước khi API kịp thấy.
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://192.168.120.9:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
