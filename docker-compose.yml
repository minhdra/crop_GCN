services:
  scanner-api:
    build: .
    ports:
      # Chỉ bind vào localhost để tránh lộ API (không có auth) ra cả mạng LAN.
      # Nếu thực sự cần truy cập từ máy khác, đổi thành "8000:8000" và tự thêm auth/reverse proxy.
      - "127.0.0.1:8000:8000"
    # Nạp toàn bộ biến tinh chỉnh (TTL dọn dẹp, giới hạn tải...) từ .env -
    # xem mô tả đầy đủ từng biến trong .env.example. Copy .env.example
    # thành .env trước khi chạy `docker compose up` nếu chưa có.
    env_file:
      - .env
    environment:
      # Ghi đè đường dẫn cho khớp bên trong container (WORKDIR /app) -
      # khác với mặc định khi chạy local, nên đặt riêng ở đây thay vì
      # trong .env dùng chung cho cả hai môi trường.
      - SCAN_OUTPUT_DIR=/app/output_scans
    volumes:
      - ./output_scans:/app/output_scans
    restart: unless-stopped
    # Giới hạn tài nguyên - CẦN chỉnh lại theo cấu hình máy chủ thật (số
    # core/RAM khả dụng) trước khi dùng production. Compose CLI (docker
    # compose, không cần Swarm) áp dụng deploy.resources.limits. Giá trị
    # dưới đây khớp với máy dev hiện tại (8 core / 16GB, Docker Desktop VM
    # cấp 8 core / ~8GB) - đặt quá thấp so với core thật (ví dụ cpus: "2"
    # trên máy 8 core) sẽ khiến job CPU-bound (OpenCV/PyMuPDF) chạy chậm hẳn
    # so với chạy local không giới hạn.
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 6g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
